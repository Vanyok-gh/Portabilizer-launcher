# Собирает Portabilizer Launcher.exe на сервере GitHub и прикладывает zip к релизу.
# Способ 1: создайте релиз с тегом launcher-v0.4 (или v0.4): сборка запустится сама.
# Способ 2: Actions -> Release launcher -> Run workflow, укажите тег уже существующего релиза: exe добавится к нему.
name: Release launcher
on:
  push:
    tags: ["launcher-v*", "v*", "V*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например V0.3 или launcher-v0.4)"
        required: true
env:
  TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Portabilizer Launcher" --icon launcher.ico launcher.py
      - name: Pack
        shell: pwsh
        run: |
          $v = "${{ env.TAG }}" -replace '^(launcher-)?[vV]',''
          Compress-Archive -Path "dist\Portabilizer Launcher.exe" -DestinationPath "Portabilizer-Launcher-v$v.zip"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ env.TAG }}"
          $zip = (Get-ChildItem Portabilizer-Launcher-v*.zip).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip "dist\Portabilizer Launcher.exe" --clobber
            # убираем приложенные архивы исходников: они не нужны пользователям
            foreach ($n in @("Portabilizer-launcher-main.zip")) { gh release delete-asset $tag $n --yes 2>$null }
          } else {
            gh release create $tag $zip "dist\Portabilizer Launcher.exe" --title "Portabilizer Launcher $tag" --generate-notes
          }
